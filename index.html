<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Statisztika – gyakorló</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap" rel="stylesheet">
<style>
:root{--paper:#f5f2ea;--sheet:#fbfaf6;--ink:#1b1a17;--muted:#6d685d;--rule:#d8d1c2;--accent:#24524a;--ok:#2e6b3b;--okbg:#e5eee1;--bad:#a3392a;--badbg:#f5e2dc}
@media (prefers-color-scheme:dark){:root{--paper:#171614;--sheet:#1e1d1a;--ink:#ebe6da;--muted:#a19a8b;--rule:#3a3731;--accent:#7fb3a6;--ok:#86c08f;--okbg:#1f2c21;--bad:#e08c7c;--badbg:#33201c}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 "IBM Plex Sans",system-ui,sans-serif}
main{max-width:760px;margin:0 auto;padding:28px 18px 64px}
h1,h2,h3{font-family:"Source Serif 4",Georgia,serif;font-weight:600;line-height:1.2;margin:0}
h1{font-size:2.1rem}
h2{font-size:1.45rem}
.eyebrow{font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.lead{color:var(--muted);margin:10px 0 0;max-width:56ch}
.mono,table,.opt .k,.num{font-family:"IBM Plex Mono",ui-monospace,monospace}
hr{border:0;border-top:1px solid var(--rule);margin:28px 0}
button{font:inherit;color:inherit;cursor:pointer}
.btn{background:var(--ink);color:var(--paper);border:1px solid var(--ink);padding:9px 16px;border-radius:3px;font-weight:500}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--rule)}
.btn:hover{opacity:.88}
.link{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;text-underline-offset:3px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.settings{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:22px;font-size:.92rem;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:3px;overflow:hidden}
.seg label{padding:5px 12px;cursor:pointer;border-left:1px solid var(--rule);color:var(--ink);font-family:"IBM Plex Mono",monospace}
.seg label:first-child{border-left:0}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg input:checked+span{font-weight:600}
.seg label:has(input:checked){background:var(--ink);color:var(--paper)}

.topics{list-style:none;margin:18px 0 0;padding:0;border-top:1px solid var(--ink)}
.topic{display:grid;grid-template-columns:2.4rem 1fr auto;gap:4px 14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--rule)}
.topic .num{color:var(--muted);font-size:.9rem}
.topic .name{font-weight:600}
.topic .sub{color:var(--muted);font-size:.85rem}
.topic .stats{grid-column:2;display:flex;gap:16px;font-size:.82rem;color:var(--muted);font-family:"IBM Plex Mono",monospace}
.topic .stats b{color:var(--ink);font-weight:500}
.topic .act{grid-column:3;grid-row:1 / span 2;display:flex;gap:14px;align-items:center}
.topic.all{border-bottom:1px solid var(--ink)}
@media (max-width:560px){.topic{grid-template-columns:2rem 1fr}.topic .act{grid-column:2;grid-row:auto;margin-top:6px}.topic .stats{flex-wrap:wrap;gap:4px 14px}}

table{border-collapse:collapse;font-size:.88rem;margin:10px 0;display:block;overflow-x:auto;max-width:100%}
th,td{border:1px solid var(--rule);padding:4px 9px;text-align:center;white-space:nowrap}
th{background:var(--sheet);font-weight:500}
.hist td,.hist th{text-align:left}

.bar{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:.88rem;color:var(--muted)}
.progress{height:2px;background:var(--rule);margin:10px 0 26px}
.progress i{display:block;height:100%;background:var(--ink);transition:width .25s}
.qnum{font-family:"Source Serif 4",Georgia,serif;font-size:1.05rem;color:var(--muted);margin-bottom:8px}
.qtext{font-size:1.08rem}
.qtext b{font-weight:600}
.opts{display:grid;gap:8px;margin:22px 0}
.opt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--sheet);border:1px solid var(--rule);border-radius:3px;padding:11px 12px}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt .k{flex:none;width:1.7rem;height:1.7rem;display:grid;place-items:center;border:1px solid var(--rule);border-radius:2px;font-size:.85rem;color:var(--muted)}
.opt .v{font-family:"IBM Plex Mono",monospace;font-size:1rem}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:var(--okbg)}
.opt.right .k{border-color:var(--ok);color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.opt.wrong .k{border-color:var(--bad);color:var(--bad)}
.opt.dim{opacity:.55}
.fb{border-left:3px solid var(--ok);padding:2px 0 2px 14px;margin:6px 0 18px}
.fb.no{border-color:var(--bad)}
.fb h3{font-size:1.1rem;margin-bottom:4px}
.fb p{margin:4px 0}
.steps{font-family:"IBM Plex Mono",monospace;font-size:.88rem;white-space:pre-wrap;background:var(--sheet);border:1px solid var(--rule);border-radius:3px;padding:10px 12px;margin:8px 0;overflow-x:auto}
.steps table{margin:0 0 8px}
.label{font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.hint{font-size:.8rem;color:var(--muted)}
@media (hover:none){.hint{display:none}}

.score{font-family:"Source Serif 4",Georgia,serif;font-size:4.5rem;line-height:1;margin:14px 0 4px}
details{border-top:1px solid var(--rule);padding:10px 0}
details summary{cursor:pointer;font-weight:500}
.theory p,.theory li{max-width:66ch}
.theory ul{padding-left:1.2rem}
.theory li{margin:5px 0}
.theory table{white-space:normal}
.theory td,.theory th{white-space:normal;text-align:left}
.theory td+td,.theory th+th{white-space:nowrap}
footer{margin-top:40px;font-size:.8rem;color:var(--muted)}
</style>
</head>
<body>
<main id="app"></main>
<script src="gen.js"></script>
<script>
const $ = s => document.querySelector(s);
const app = $('#app');
const KEY = 'stat-gyakorlo-v1';
const ALL = { id: 'all', name: 'Összes téma', en: 'vegyes' };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function load() { try { return JSON.parse(localStorage.getItem(KEY)) || { hist: [], n: 10 }; } catch { return { hist: [], n: 10 }; } }
function save() { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch {} }
let store = load(), S = null;
const topicById = id => id === 'all' ? ALL : TOPICS.find(t => t.id === id);

function stats(id) {
  const h = store.hist.filter(x => x.topic === id);
  if (!h.length) return '<span>Még nincs kitöltés</span>';
  return `<span>Utolsó <b>${h[h.length - 1].pct}%</b></span><span>Legjobb <b>${Math.max(...h.map(x => x.pct))}%</b></span><span>Átlag <b>${Math.round(h.reduce((s, x) => s + x.pct, 0) / h.length)}%</b></span><span>Kitöltés <b>${h.length}</b></span>`;
}

function home() {
  S = null;
  const row = (t, i) => `<li class="topic${t.id === 'all' ? ' all' : ''}">
    <span class="num">${t.id === 'all' ? '00' : String(i + 1).padStart(2, '0')}</span>
    <div><div class="name">${t.name}</div><div class="sub">${t.en}</div></div>
    <div class="stats">${stats(t.id)}</div>
    <div class="act">${t.id === 'all' ? '' : `<button class="link" data-theory="${t.id}">Elmélet</button>`}<button class="btn" data-start="${t.id}">Indítás</button></div></li>`;
  const hist = store.hist.slice(-15).reverse();
  app.innerHTML = `
    <div class="eyebrow">Statistics · University of Pannonia</div>
    <h1>Statisztika gyakorló</h1>
    <p class="lead">Véletlenszerűen generált feladatok a zh anyagából. Számold ki, válaszd ki az eredményt, és minden kérdés után megkapod a levezetést.</p>
    <div class="settings">Kérdések száma
      <span class="seg">${[5, 10, 20, 30].map(n => `<label><input type="radio" name="n" value="${n}"${store.n === n ? ' checked' : ''}><span>${n}</span></label>`).join('')}</span></div>
    <ul class="topics">${row(ALL)}${TOPICS.map(row).join('')}</ul>
    <hr>
    <h2>Eredmények</h2>
    ${hist.length ? `<table class="hist"><tr><th>Dátum</th><th>Téma</th><th>Helyes</th><th>%</th></tr>${hist.map(h => `<tr><td>${h.date}</td><td>${esc(topicById(h.topic)?.name || h.topic)}</td><td>${h.ok} / ${h.n}</td><td>${h.pct}%</td></tr>`).join('')}</table>
    <button class="link" id="clear">Eredmények törlése</button>` : '<p class="lead">Itt jelennek majd meg a kitöltött gyakorlások eredményei.</p>'}
    <footer>Az eredmények csak ebben a böngészőben tárolódnak.</footer>`;
  app.querySelectorAll('input[name=n]').forEach(r => r.onchange = () => { store.n = +r.value; save(); });
  app.querySelectorAll('[data-start]').forEach(b => b.onclick = () => start(b.dataset.start));
  app.querySelectorAll('[data-theory]').forEach(b => b.onclick = () => theory(b.dataset.theory));
  const c = $('#clear'); if (c) c.onclick = () => { if (confirm('Biztosan törlöd az összes eredményt?')) { store.hist = []; save(); home(); } };
  scrollTo(0, 0);
}

function theory(id) {
  const t = topicById(id);
  app.innerHTML = `<button class="link" id="back">Vissza</button>
    <div class="eyebrow" style="margin-top:18px">Elmélet · ${t.en}</div><h1>${t.name}</h1>
    <div class="theory">${t.theory}</div>
    <div class="row" style="margin-top:24px"><button class="btn" id="go">Gyakorlás indítása</button></div>`;
  $('#back').onclick = home; $('#go').onclick = () => start(id);
  scrollTo(0, 0);
}

function nextGen() {
  const pool = S.topic === 'all' ? TOPICS.flatMap(t => t.gens) : topicById(S.topic).gens;
  let g; do { g = pool[Math.floor(Math.random() * pool.length)]; } while (pool.length > 1 && g === S.lastGen);
  S.lastGen = g; return make(g);
}

function start(id) { S = { topic: id, n: store.n, i: 0, ok: 0, missed: [] }; ask(); }

function ask() {
  S.cur = nextGen(); S.done = false;
  const t = topicById(S.topic);
  app.innerHTML = `
    <div class="bar"><span>${t.name}</span><span class="mono">${S.ok} helyes · ${S.i + 1} / ${S.n}</span></div>
    <div class="progress"><i style="width:${S.i / S.n * 100}%"></i></div>
    <div class="qnum">Feladat ${S.i + 1}.</div>
    <div class="qtext">${S.cur.q}</div>
    <div class="opts">${S.cur.opts.map((o, i) => `<button class="opt" data-i="${i}"><span class="k">${'ABCD'[i]}</span><span class="v">${o.t}</span></button>`).join('')}</div>
    <div id="fb"></div>
    <div class="row" style="margin-top:18px"><button class="link" id="quit">Kilépés</button><span class="hint">Billentyűk: A–D vagy 1–4, Enter a továbblépéshez</span></div>`;
  app.querySelectorAll('.opt').forEach(b => b.onclick = () => answer(+b.dataset.i));
  $('#quit').onclick = () => { if (S.i === 0 || confirm('Kilépsz? Ez a gyakorlás nem kerül mentésre.')) home(); };
  scrollTo(0, 0);
}

function answer(i) {
  if (S.done) return; S.done = true;
  const q = S.cur, o = q.opts[i], ok = !!o.ok, right = q.opts.find(x => x.ok);
  if (ok) S.ok++; else S.missed.push({ q: q.q, chosen: o, right: right.t, sol: q.sol });
  app.querySelectorAll('.opt').forEach((b, j) => { b.disabled = true; if (q.opts[j].ok) b.classList.add('right'); else if (j === i) b.classList.add('wrong'); else b.classList.add('dim'); });
  const last = S.i + 1 === S.n;
  $('#fb').innerHTML = `<div class="fb${ok ? '' : ' no'}">
      <h3>${ok ? 'Helyes' : 'Nem jó'}</h3>
      ${ok ? '' : `<p><b>Miért nem ${esc(o.t)}?</b> ${o.why}</p><p>A helyes válasz: <b class="mono">${right.t}</b></p>`}
      <div class="label">${ok ? 'Miért ez a helyes' : 'Így kellett kiszámolni'}</div>
      <div class="steps">${q.sol}</div></div>
    <div class="row"><button class="btn" id="next">${last ? 'Eredmény' : 'Következő'}</button></div>`;
  $('#next').onclick = next; $('#next').focus({ preventScroll: true });
  $('#fb').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function next() { S.i++; S.i < S.n ? ask() : result(); }

function result() {
  const pct = Math.round(S.ok / S.n * 100), d = new Date();
  store.hist.push({ topic: S.topic, ok: S.ok, n: S.n, pct, date: `${d.getFullYear()}.${String(d.getMonth() + 1).padStart(2, '0')}.${String(d.getDate()).padStart(2, '0')} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}` });
  store.hist = store.hist.slice(-200); save();
  const t = topicById(S.topic), id = S.topic;
  app.innerHTML = `<div class="eyebrow">Eredmény · ${t.name}</div>
    <div class="score">${pct}%</div>
    <p class="lead">${S.ok} / ${S.n} helyes válasz.</p>
    <div class="row" style="margin:20px 0">
      <button class="btn" id="again">Újra</button>
      ${id !== 'all' ? '<button class="btn ghost" id="th">Elmélet</button>' : ''}
      <button class="btn ghost" id="home">Témák</button></div>
    ${S.missed.length ? `<h2 style="margin-top:28px">Hibás válaszok</h2>${S.missed.map(m => `<details><summary>${m.q.replace(/<table[\s\S]*?<\/table>/g, '[táblázat] ').replace(/<[^>]+>/g, '').slice(0, 110)}</summary>
      <div class="qtext" style="margin-top:8px">${m.q}</div>
      <p>A te válaszod: <span class="mono">${m.chosen.t}</span>. ${m.chosen.why}</p>
      <p>Helyes: <b class="mono">${m.right}</b></p><div class="steps">${m.sol}</div></details>`).join('')}` : ''}`;
  $('#again').onclick = () => start(id); $('#home').onclick = home;
  const th = $('#th'); if (th) th.onclick = () => theory(id);
  S = null; scrollTo(0, 0);
}

addEventListener('keydown', e => {
  if (!S || e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key.toLowerCase(), idx = 'abcd'.indexOf(k) >= 0 ? 'abcd'.indexOf(k) : '1234'.indexOf(k);
  if (!S.done && idx >= 0) answer(idx);
  else if (S.done && k === 'enter' && document.activeElement?.id !== 'next') next();
});

home();
</script>
</body>
</html>
